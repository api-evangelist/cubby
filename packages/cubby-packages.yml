  Cubby publishes NO client SDK in any public package registry. Searched npm, PyPI,
  RubyGems, crates.io, Packagist, NuGet, Maven Central and pkg.go.dev for a first-party
  Cubby client library and found none; the two public repositories in the github.com/cubbystorage
