    via: customerId
  - belongs_to: Facility
    via: facilityId
reports:
  description: >-
    Report endpoints are projections over the graph rather than entities in it.
  endpoints:
  - POST /v1/reports/rent-roll
  - POST /v1/reports/aged-receivables
  - POST /v1/reports/general-ledger/cash
  - POST /v1/reports/general-ledger/accrual
  - POST /v1/reports/merchant-services-disbursements
analytics_warehouse:
  published: true
  platform: BigQuery
  dataset: analytics
  url: https://cubbystorage.github.io/docs/data-dictionary/
  description: >-
    Cubby also publishes a data-warehouse dictionary — the analytics BigQuery dataset mirrors the
    operational data (facilities, units, leases, contacts, payments, communications), denormalized
    with descriptive columns and foreign keys, plus an interactive schema diagram.
  refresh:
    most_tables: hourly
    daily:
    - spaces_historical
    - ga_events
  note: >-
    The table/column list is loaded client-side from a JSON payload the page fetches at runtime,
    so individual table names beyond the two named above were not captured in this pass. The
    warehouse is a second, materially different read surface from the Operator API and is worth
    a dedicated harvest.
expansions:
  style: out-of-line auxiliary arrays keyed by embedded entity IDs
  documented_examples:
  - pricingGroup (on Leases Search, added 2025-10)
  - schedules (on Facilities Search, added 2026-06)
  - coverageProgram (on Coverage)
