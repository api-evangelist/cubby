generated: '2026-08-11'
method: searched
source: https://cubbystorage.github.io/docs/api/
description: >-
  The Cubby entity graph, read from the endpoint families, the documented ID prefixes, the
  expansion targets and the webhook entity reference. Cubby exposes its entities under prefixed
  IDs of the form <prefix>_<alpha>, so the object domain is unusually legible for an API with no
  published schema. DERIVED FROM THE PUBLISHED REFERENCE, not from an OpenAPI — Cubby publishes
  no machine-readable spec, so relationships below are read from documented fields and expansions
  rather than from $ref links, and confidence is noted where the docs are indirect.
id_scheme:
  pattern: '<prefix>_<alpha>'
  documented_prefixes:
  - prefix: org_
    entity: Organization
    example: org_Ji9JKfKkhuR
  - prefix: fac_
    entity: Facility
    example: fac_C7bSZyPT6fp
  - prefix: unit_
    entity: Unit
    example: unit_GfNkzV4itfk
  - prefix: pg_
    entity: Pricing Group
    example: pg_4a2da7d271a
  - prefix: cust_
    entity: Customer
    example: cust_FiUtBj8JkF
  - prefix: lease_
    entity: Lease
    example: lease_jOi8joH3Hu
  - prefix: lead_
    entity: Lead
    example: lead_Hj8JkFiUtB
  - prefix: quote_
    entity: Quote
    example: quote_IJf03jNjKuf
entities:
- name: Organization
  endpoints:
  - POST /v1/organizations/search
  description: The tenancy root. API credentials attach to an Organization and see everything
    visible to it.
  relationships:
  - has_many: Facility
    via: organizationId
  - has_many: Manager
  - has_many: FacilityGroup
- name: FacilityGroup
  endpoints:
  - POST /v1/facility-groups/search
  added: '2026-06'
  relationships:
  - has_many: Facility
- name: Facility
  endpoints:
  - POST /v1/facilities/search
  fields_documented:
  - timeZone
  - schedules (expansion)
  relationships:
  - belongs_to: Organization
    via: organizationId
  - has_many: Unit
    via: facilityId
  - has_many: PricingGroup
    via: facilityId
  - has_many: Lease
    via: facilityId
  - has_many: AccessCode
  note: >-
    Facility carries the timezone that gives suffix-less timestamps their meaning across the
    whole API — it is the semantic anchor of the date/time convention.
- name: Unit
  endpoints:
  - POST /v1/units/search
  - POST /v1/units/set-rentability
  fields_documented:
  - legacyId
  - walkthroughOrder
  - rentability
  relationships:
  - belongs_to: Facility
    via: facilityId
  - belongs_to: PricingGroup
    via: pricingGroupId
  - has_one: Lease
    via: unitId
    cardinality_note: one active lease at a time
  - has_many: Lock
- name: PricingGroup
  endpoints:
  - POST /v1/pricing-groups/search
  - POST /v1/pricing-groups/change-rates
  - POST /v1/pricing-groups/find-unit-for-tier
  - POST /v1/storefront/pricing-groups/search
  fields_documented:
  - valuePricingStatus (NOT_CONFIGURED | REVIEW_REQUIRED | APPROVED)
  - availableTiers (LOWEST | MEDIUM | HIGHEST)
  - strikethroughRate
  relationships:
  - belongs_to: Facility
    via: facilityId
  - has_many: Unit
  - has_many: Discount
    via: pricingGroups
  - has_one: ValuePricingStrategy
- name: ValuePricingStrategy
  endpoints:
  - POST /v1/value-pricing-strategies/search
  added: '2026-05'
- name: Discount
  endpoints:
  - POST /v1/discounts/search
  fields_documented:
  - applicationPercentage
  - applicationAmount (deprecated for percentage discounts)
  - pricingGroups
  relationships:
  - belongs_to_many: PricingGroup
- name: Customer
  endpoints:
  - POST /v1/customers/search
  - POST /v1/customers/update
  pii: true
  fields_documented:
  - name / firstName / lastName
  - companyName
  - military
  - contact (email, phone, address, address2, city)
  relationships:
  - has_many: Lease
    via: customerId
  - has_many: Lead
    via: customerId
  - has_many: PaymentMethod
  - has_many: AlternativeContact
- name: Lead
  endpoints:
  - POST /v1/leads/search
  - POST /v1/leads/create
  - POST /v1/leads/update
  fields_documented:
  - source (WEBSITE | WALK_IN | CALL | CONTACT_FORM | ABANDONED_CHECKOUT | FAILED_CHECKOUT |
    RESERVED_CHECKOUT | SMS_MESSAGE | WAITLIST_FORM | RESERVATION_FORM | REFERRAL | SEARCH_ENGINE
    | DIGITAL_AD | BILLBOARD | PHYSICAL_AD | AI_VOICE_AGENT | SPAREFOOT | OTHER)
  - status (NEW | ON_HOLD | IN_PROGRESS_HOT | IN_PROGRESS_COLD | CONVERTED | UNQUALIFIED |
    DUPLICATE | RESERVATION)
  - origin (MANAGER | API | AI_VOICE_AGENT | CONTACT_FORM | WAITLIST_FORM | RESERVATION_FORM |
    WEBSITE_CHECKOUT)
  - targetMoveInDate
  - customSource
  relationships:
  - belongs_to: Customer
    via: customerId
  - belongs_to: Facility
    via: facilityId
  - belongs_to: PricingGroup
    via: pricingGroupId
  - converts_to: Lease
- name: Lease
  endpoints:
  - POST /v1/leases/search
  - POST /v1/leases/create
  - POST /v1/leases/checkout
  - POST /v1/leases/cancel-lease
  - POST /v1/leases/schedule-move-out
  - POST /v1/leases/preview-charges
  - POST /v1/leases/get-move-in-charges
  - POST /v1/leases/get-upsells
  - POST /v1/leases/make-payment
  - POST /v1/leases/get-payment-link
  - POST /v1/leases/get-documents-link
  - POST /v1/leases/enable-auto-pay
  - POST /v1/leases/disable-auto-pay
  - POST /v1/leases/change-rents
  - POST /v1/leases/cancel-rent-changes
  - POST /v1/leases/get-rent-change-schedules
  - POST /v1/leases/get-compliances
  - POST /v1/leases/update-alternative-contacts
  description: The central aggregate. 17 of the ~70 documented operations act on it.
  relationships:
  - belongs_to: Customer
    via: customerId
  - belongs_to: Unit
    via: unitId
  - belongs_to: Facility
    via: facilityId
  - has_one: Balances
  - has_many: Ledger
  - has_many: Payment
  - has_one: Coverage
  - has_many: RentChangeSchedule
  - has_many: Note
  - has_one: Auction
    condition: on delinquency
- name: Balances
  description: Lease balance rollup carried inline on lease payloads and webhooks.
  relationships:
  - belongs_to: Lease
- name: PaymentMethod
  endpoints:
  - POST /v1/payment-methods/search
  - POST /v1/payment-methods/create
  relationships:
  - belongs_to: Customer
    via: customerId
  - used_by: Lease
    via: AutoPay enrolment
- name: Payment
  endpoints:
  - POST /v1/payments/search
  fields_documented:
