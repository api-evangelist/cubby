  - POST /v1/coverage/enroll
  - POST /v1/coverage/unenroll
  - POST /v1/coverage/add-private-policy
  - POST /v1/coverage/remove-private-policy
  - POST /v1/coverage/download-private-policy
  - POST /v1/coverage-levels/search
  relationships:
  - belongs_to: Lease
  - has_one: CoverageProgram
    via: coverageProgram expansion
  - has_one: CoverageLevel
- name: Auction
  endpoints:
  - POST /v1/auctions/search
  - POST /v1/auctions/create
  - POST /v1/auctions/start-lien
  - POST /v1/auctions/cancel-lien
  fields_documented:
  - leaseConfigurationId
  relationships:
  - belongs_to: Lease
  - belongs_to: Unit
- name: AccessCode
  endpoints:
  - POST /v1/access-codes/search
  - POST /v1/access-codes/check
  relationships:
  - belongs_to: Facility
  - belongs_to: Customer
- name: Lock
  endpoints:
  - POST /v1/locks/search
  - POST /v1/locks/register
  - POST /v1/locks/attach
  - POST /v1/locks/transfer
  - POST /v1/locks/return
  - POST /v1/locks/disable
  relationships:
  - belongs_to: Unit
  - belongs_to: Facility
- name: Manager
  endpoints:
  - POST /v1/managers/search
  relationships:
  - belongs_to: Organization
- name: Note
  endpoints:
  - POST /v1/notes/search
  - POST /v1/notes/create
  relationships:
  - belongs_to: Lease
  - belongs_to: Customer
- name: Task
  endpoints:
  - POST /v1/tasks/search
  - POST /v1/tasks/create
  relationships:
  - belongs_to: Facility
- name: Message
  endpoints:
  - POST /v1/messages/email/send
  - POST /v1/messages/sms/send
  constraints:
  - email subject max 255 characters
  - email body max 256 KB (262,144 characters)
  relationships:
