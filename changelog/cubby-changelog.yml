- date: '2026-08'
  version: v1
  breaking: false
  additions:
  - 'Rent Roll Report: lastRentChangeDate field on POST /v1/reports/rent-roll'
  - 'Rent Roll Report: effectiveRate field (net rent in cents after discounts and waived rent)'
  changes:
  - 'Managers Search: the phone filter on POST /v1/managers/search is now normalised to
    E.164 and matched exactly; a value that is not a full phone number is rejected with 400
    and partial-number search is no longer supported on this filter'
  note: >-
    The managers/search phone change is a behavioural break shipped as a changelog note —
    a previously-working partial search now returns 400.
