name: Cubby Operator API Changelog
description: >-
  Cubby maintains a dated, month-grouped changelog inside its public API reference.
  Entries are written at field and endpoint granularity — each names the exact endpoint
  and the exact field added, changed or deprecated — which is materially more useful to
  an integrator than a release-notes blog. 53 entries across 13 months are published,
  running from December 2024 to August 2026.
scheme:
  versioning: path
  current_version: v1
  granularity: month
  cadence: monthly (13 dated months published; every month from September 2025 forward)
  breaking_change_signalling: >-
    Breaking changes are announced as deprecations with a named removal month inside the
    same changelog. Example — the June 2026 entry states that the applicationAmount value
    for percentage discounts "is deprecated and scheduled for removal in mid-July 2026".
    There is no separate deprecation policy page and no Sunset/Deprecation response headers
    are documented.
  machine_readable_feed: false
  note: >-
    The changelog is HTML inside the Slate reference. There is no RSS/Atom feed, no JSON
    feed, and no per-entry permalink beyond the month anchor.
window: 2024-12 to 2026-08
entry_count: 53
