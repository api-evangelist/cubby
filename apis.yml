aid: cubby
name: Cubby
description: 'Cubby is a New York City based software company building an AI-native
  facility management platform for self-storage operators, replacing legacy FMS systems
  with facility operations, tenant management, revenue management, e-commerce storefronts,
  embedded payment processing and AI-driven tenant communications. Cubby publishes
  a public developer documentation site covering a JSON HTTP Operator API of roughly
  70 action-oriented endpoints across facilities, units, leases, customers, leads,
  payments, coverage, auctions and reporting, a BigQuery analytics data warehouse,
  Make.com outbound webhooks, embeddable Lit storefront web components, and an OAuth-protected
  Model Context Protocol server. The company was founded in 2022 by Matt Engfer and
  Adam Fleming and raised a $63M Series A led by Growth Equity at Goldman Sachs Alternatives
  in January 2026.'
image: https://www.cubbystorage.com/og-logo.png
