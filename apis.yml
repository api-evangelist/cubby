- name: Cubby Storefront API
  description: 'The Cubby Storefront API is the public, unauthenticated-tenant-facing
    slice of the Cubby platform used to power online rental storefronts — facility
    search and pricing-group search — and is the same API key surface consumed by the
    Cubby storefront web components and the embeddable checkout flow.'
  humanURL: https://cubbystorage.github.io/docs/api/#storefront-2
  baseURL: https://api.cubbystorage.com/v1/storefront
  tags:
  - E-Commerce
  - Self Storage
  - Checkout
  properties:
  - type: Documentation
    url: https://cubbystorage.github.io/docs/api/#storefront-2
  - type: Components
    url: components/cubby-components.yml
- name: Cubby MCP Server
  description: 'Cubby operates a hosted Model Context Protocol server at api.cubbystorage.com/mcp.
    The endpoint is live and OAuth-protected: an unauthenticated JSON-RPC tools/list
    call returns HTTP 401 with a WWW-Authenticate Bearer challenge pointing at the
    RFC 9728 protected-resource metadata document. The authorization server metadata
    advertises authorization-code and refresh-token grants, PKCE S256, dynamic client
    registration and a single `mcp` scope.'
  humanURL: https://api.cubbystorage.com/.well-known/oauth-protected-resource
  baseURL: https://api.cubbystorage.com/mcp
  tags:
  - MCP
  - Artificial Intelligence
  - Agents
  properties:
  - type: MCPServer
    url: mcp/cubby-mcp.yml
  - type: OAuthScopes
    url: scopes/cubby-scopes.yml
