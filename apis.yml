apis:
- name: Cubby Operator API
  description: 'The Cubby Operator API is a JSON HTTP API — explicitly not RESTful
    — oriented around actions performed on system entities rather than transfer of
    state. Roughly 70 POST endpoints cover access codes, locks, organizations, managers,
    facilities, facility groups, units, pricing groups, customers, leads, leases, payment
    methods, ledgers, coverage, payments, auctions, notes, tasks, reports, storefront
    search, messaging and checkout. Responses are wrapped in a {status, data} envelope,
    money is expressed as integer cents, timestamps are ISO-8601 with facility-local
    or UTC semantics, and related entities are retrieved through explicit expansions.'
  humanURL: https://cubbystorage.github.io/docs/api/
  baseURL: https://api.cubbystorage.com/v1
  tags:
  - Self Storage
  - Facility Management
  - Leases
  - Payments
  - Property Management
