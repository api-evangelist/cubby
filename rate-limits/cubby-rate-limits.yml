note: >-
  CUBBY DOCUMENTS NO RATE LIMITS. The full API reference was read and searched for "rate limit",
  "429", "Retry-After", "X-RateLimit" and "RateLimit" — no match. The Introduction covers the
  response envelope, errors, IDs, money, date/time, expansions, authentication, PII and roles,
  and never mentions throttling. The documented error statuses are 400, 401, 403, 404 and 500;
  429 is not among them. An integrator therefore has no published budget, no documented
  exhaustion behaviour, and no runtime signal to back off on — which matters more than usual
  here because every operation including reads is a POST, so nothing is cacheable and polling
  via updatedAfter cursors is the sanctioned sync pattern.
